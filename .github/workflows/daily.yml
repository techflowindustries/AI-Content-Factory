name: Daily What-If Video

on:
  schedule:
    # 03:00 in Itajaí (UTC-3). GitHub Actions cron is UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate What-If video
        run: python whatif_main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          GEMINI_VIDEO_MODEL: gemini-omni-1.2-flash
          GEMINI_VIDEO_RESOLUTION: 720p
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: CwhRBWXzGAHq8TQ4Fs17
          ELEVENLABS_MODEL_ID: eleven_v3
          OUTPUT_DIR: output
          WORK_DIR: work

      - name: Upload finished video and production files
        uses: actions/upload-artifact@v4
        with:
          name: whatif-video-${{ github.run_number }}
          path: |
            output/
            work/story.json
          if-no-files-found: error
          retention-days: 7
